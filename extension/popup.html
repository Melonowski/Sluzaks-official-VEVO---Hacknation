<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <style>
    body {
      width: 280px;
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      padding: 16px;
      margin: 0;
    }
    h2 { font-size: 16px; margin: 0 0 8px 0; color: #38bdf8; }
    p { font-size: 12px; color: #cbd5e1; line-height: 1.4; margin: 0 0 14px 0; }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #1e293b;
      padding: 10px 12px;
      border-radius: 8px;
      margin-bottom: 12px;
    }
    a.btn {
      display: block;
      text-align: center;
      background: #2563eb;
      color: white;
      text-decoration: none;
      padding: 9px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
    }
    a.btn:hover { background: #1d4ed8; }
  </style>
</head>
<body>
  <h2>🛡️ Prawdowid Asystent</h2>
  <p>Kliknij Profesorka w prawym dolnym rogu, a potem przeciągnij myszką, aby zaznaczyć fragment ekranu do weryfikacji.</p>
  <div class="row">
    <span style="font-size: 13px;">Pokaż Profesorka na stronach</span>
    <input type="checkbox" id="toggleOverlay" checked />
  </div>
  <a class="btn" href="http://localhost:3000" target="_blank">Otwórz panel główny WWW</a>

  <script>
    const extApi = typeof browser !== "undefined" && browser.storage ? browser : chrome;
    const toggle = document.getElementById("toggleOverlay");

    try {
      const res = extApi.storage.local.get(["prawdowid_enabled"]);
      if (res && typeof res.then === "function") {
        res.then((data) => {
          toggle.checked = data?.prawdowid_enabled !== false;
        });
      } else {
        extApi.storage.local.get(["prawdowid_enabled"], (data) => {
          toggle.checked = data?.prawdowid_enabled !== false;
        });
      }
    } catch (_) {}

    toggle.addEventListener("change", () => {
      try {
        extApi.storage.local.set({ prawdowid_enabled: toggle.checked });
      } catch (_) {}
    });
  </script>
</body>
</html>
